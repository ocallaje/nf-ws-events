plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.15'
}

version = '0.1.0'

nextflowPlugin {
    nextflowVersion = '26.10.0'

    provider = 'websockets'
    className = 'websockets.plugin.WsEventsPlugin'
    extensionPoints = [
        'websockets.plugin.WsEventsFactory',
        'websockets.plugin.WsEventsConfig',
        'websockets.plugin.WsEventsExtension'
    ]

}
